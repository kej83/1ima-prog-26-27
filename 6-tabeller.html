<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tabeller</h1>

    <h2>Enkel tabell</h2>
    <!-- ctrl + * for å lage kommentar  -->
    <!-- 
    table : tabell
    tr : table row
    td : table data 
    -->

    <table>   
<tr>
<td>Navn</td> 
<td>Karakter</td>
</tr>

<tr>
<td>Jens</td>
<td>5</td>
</tr>

<tr>
    <td>Per</td>
    <td>4</td>
</tr>
    </table>


    <h2>Større tabell med overskrifter</h2>
<!-- th : table header -->
    <table>
        <tr>
            <th>Name</th>
            <th>Sex</th>
            <th>Height (cm)</th>
            <th>Weight (kg)</th>
        </tr>
        <tr>
            <td>Jens</td>
            <td>Male</td>
            <td>178</td>
            <td>79</td>
        </tr>
        <tr>
            <td>Sara</td>
            <td>Female</td>
            <td>159</td>
            <td>55</td>
        </tr>
    </table>

</body>
</html>
